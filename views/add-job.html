<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/img/grc_logo_green.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <script defer src="/js/validation.js"></script>
    <title>Add Job | Trades Job Board</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-bg">
        <div class="container-fluid navbar-container d-flex flex-nowrap">
            <a class="navbar-brand d-flex flex-column align-items-center justify-content-start nav-link" href="/">
                <img src="/img/grc_logo_white.png" width="97" alt="GRC Logo">
                Trades Job Board
            </a>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/">All Jobs</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/add-job">Add Job</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="https://greenriver.edu/students/academics/areas-of-interest/program-maps/trades-industrial-tech-aviation-natural-resources/index.html" target="_blank">GRC Trades Page</a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="container-fluid w-75">
        <h2>Add Job</h2>
        <p id="err" class="text-danger"></p>
        <form id="add-job-form" action="/submit-job" method="post">
            <fieldset id="job-info">
                <legend>Basic Information</legend>
                <div class="mb-1">
                    <label class="form-label" for="title">Job Title</label>
                    <input class="form-control" type="text" id="title" name="title" maxlength="100">
                </div>
                <div class="mb-1">
                    <label class="form-label" for="company">Company</label>
                    <input class="form-control" type="text" id="company" name="company" maxlength="100">
                </div>
                <div class="mb-1">
                    <label class="form-label" for="location">Location</label>
                    <input class="form-control" type="text" id="location" name="location" maxlength="100">
                </div>
                <div class="mb-1">
                    <label class="form-label" for="post_date">Post Date</label>
                    <input class="form-control" type="date" id="post_date" name="post_date">
                    <label class="form-label" for="close_date">Close Date</label>
                    <input class="form-control" type="date" id="close_date" name="close_date">
                </div>
                <div class="mb-1">
                    <label class="form-label" for="trade">Trade</label>
                    <select class="form-select" id="trade" name="trade">
                        <option>Select a trade...</option>
                        <option value="Automotive">Automotive</option>
                        <option value="Carpentry">Carpentry</option>
                        <option value="Mechatronics">Mechatronics</option>
                    </select>
                </div>
                <div class="mb-1 form-check">
                    <input class="form-check-input" type="checkbox" id="is_internship" name="is_internship">
                    <label class="form-check-label" for="is_internship">This position is an internship</label>
                </div>
            </fieldset>
            <fieldset id="job-type">
                <legend>Employment Type</legend>
                <div class="form-check">
                    <input class="form-check-input" type="radio" id="full-time" name="type" value="Full-time">
                    <label class="form-check-label" for="full-time">Full-time</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" id="part-time" name="type" value="Part-time">
                    <label class="form-check-label" for="part-time">Part-time</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" id="contract" name="type" value="Contract">
                    <label class="form-check-label" for="contract">Contract</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" id="seasonal" name="type" value="Seasonal">
                    <label class="form-check-label" for="seasonal">Seasonal</label>
                </div>
            </fieldset>
            <fieldset id="additional-info">
                <legend>Additional information</legend>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="is_paid" name="is_paid">
                    <label class="form-check-label" for="is_paid">This position is paid</label>
                </div>
                <label class="form-label" for="compensation">Compensation details (if applicable)</label>
                <input class="form-control" type="text" id="compensation" name="compensation" maxlength="100">
                <label class="form-label" for="posting_link">Link to job posting on company's website</label>
                <input class="form-control" type="text" id="posting_link" name="posting_link" maxlength="500">
                <label class="form-label" for="description">Job description</label>
                <textarea class="form-control" id="description" name="description" rows="6" maxlength="1024" placeholder="Briefly describe the role..."></textarea>
            </fieldset>
            <button type="submit" id="submit-job-button" class="btn btn-dark">Add Job</button>
        </form>
    </div>
</body>
</html>
