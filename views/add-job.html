<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/img/grc_logo_green.png" type="image/png">
    <script defer src="/js/validation.js"></script>
    <title>Add Job | Trades Job Board</title>
</head>
<body>
    <header> 
        <div class="header-title">
            <img src="/img/grc_logo_white.png">
            <h1>Green River Community College</h1>
            <h1>Trades Job Board</h1>
        </div>
        <nav class="header-nav">
            <ul>
                <li><a href="/">All Jobs</a></li>
                <li><a href="https://greenriver.edu/students/academics/areas-of-interest/program-maps/trades-industrial-tech-aviation-natural-resources/index.html" target="_blank">GRC Trades Page</a></li>
            </ul>
        </nav>
    </header>
    <h2>Add Job</h2>
    <span><p id="err"></p></span>
    <form id="add-job-form" action="/submit-job" method="post">
        <fieldset id="job-info">
            <legend>Basic Information</legend>
            <label for="title">
                Job Title
                <input type="text" id="title" name="title" maxlength="100">
            </label>
            <label for="company">
                Company
                <input type="text" id="company" name="company" maxlength="100">
            </label>
            <label for="location">
                Location
                <input type="text" id="location" name="location" maxlength="100">
            </label>
            <label for="post_date">
                Post Date
                <input type="date" id="post_date" name="post_date">
            </label>
            <label for="close_date">
                Close Date
                <input type="date" id="close_date" name="close_date">
            </label>
            <label for="trade">
                Trade
                <select id="trade" name="trade">
                    <option>Select a trade...</option>
                    <option value="Automotive">Automotive</option>
                    <option value="Carpentry">Carpentry</option>
                    <option value="Mechatronics">Mechatronics</option>
                </select>
            </label>
            <label for="is_internship">
                <input type="checkbox" id="is_internship" name="is_internship">
                This position is an internship
            </label>
        </fieldset>
        <fieldset id="job-type">
            <legend>Employment Type</legend>
            <label for="full-time">
                <input type="radio" id="full-time" name="type" value="Full-time">
                Full-time
            </label>
            <label for="part-time">
                <input type="radio" id="part-time" name="type" value="Part-time">
                Part-time
            </label>
            <label for="contract">
                <input type="radio" id="contract" name="type" value="Contract">
                Contract
            </label>
            <label for="seasonal">
                <input type="radio" id="seasonal" name="type" value="Seasonal">
                Seasonal
            </label>
        </fieldset>
        <fieldset id="additional-info">
            <legend>Additional information</legend>
            <label for="is_paid">
                <input type="checkbox" id="is_paid" name="is_paid">
                This position is paid
            </label>
            <label for="compensation">
                Compensation details (if applicable)
                <input type="text" id="compensation" name="compensation" maxlength="100">
            </label>
            <label for="posting_link">
                Link to job posting on company's website
                <input type="text" id="posting_link" name="posting_link" maxlength="250">
            </label>
            <label for="description">
                Job description
                <textarea id="description" name="description" rows="6" maxlength="250" placeholder="Briefly describe the role..."></textarea>
            </label>
        </fieldset>
        <button type="submit" id="submit-job-button">Add Job</button>
    </form>
</body>
</html>
